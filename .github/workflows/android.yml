name: 디버그 APK 빌드

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: 판정 로직 테스트
        run: ./gradlew :core:test --stacktrace

      - name: 디버그 APK 빌드
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: APK 이름 정리
        run: cp app/build/outputs/apk/debug/app-debug.apk dongmyeon-jeongbok-${{ github.run_number }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: dongmyeon-jeongbok-debug-${{ github.run_number }}
          path: dongmyeon-jeongbok-${{ github.run_number }}.apk

      # 폰 브라우저에서 바로 받을 수 있게 Releases 에도 올림
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: 동면 정복 빌드 #${{ github.run_number }}
          body: |
            커밋: ${{ github.sha }}
            아래 Assets 의 .apk 파일을 폰에서 내려받아 설치하세요.
          files: dongmyeon-jeongbok-${{ github.run_number }}.apk
          make_latest: true

      - name: 테스트 리포트(실패 시)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: core/build/reports/tests/
